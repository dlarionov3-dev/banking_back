# Переключаем Tomcat, пул задач и планировщик на виртуальные потоки Java 21
spring:
  threads:
    virtual:
      enabled: true
  datasource:
    hikari:
      virtual-threads: true
      maximum-pool-size: 8
    url: jdbc:postgresql://localhost:5431/virtualthreads
    username: postgres
    password: password
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

